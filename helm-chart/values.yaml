replicaCount: 2

image:
  repository: "533267338763.dkr.ecr.ap-south-1.amazonaws.com/myapp-repo"
  tag: "latest"
  pullPolicy: IfNotPresent

# Image pull secret for private ECR
imagePullSecrets:
  - name: ecr-secret

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  httpGet:
    path: /
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /
    port: 5000
  initialDelaySeconds: 30
  periodSeconds: 20
  failureThreshold: 3

env:
  - name: SSM_PARAM_NAME
    value: "/myapp/hello_msg"
  - name: AWS_REGION
    value: "ap-south-1"


  - name: AWS_DEFAULT_REGION
    value: "ap-south-1"

podAnnotations:
  eks.amazonaws.com/role-arn: arn:aws:iam::533267338763:role/myapp-irsa-role

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

serviceAccount:
  create: true
  name: "myapp-sa"
