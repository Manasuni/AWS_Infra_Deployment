name: CICD Pipeline

on:
  push:
    branches:
      - cicd   # Only runs on pushes to cicd branch
  pull_request:
    branches:
      - cicd

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lint (flake8)
        run: flake8 main.py tests/

      - name: Run tests (pytest)
        run: pytest -v
