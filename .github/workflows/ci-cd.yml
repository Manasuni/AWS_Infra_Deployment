name: CICD Pipeline

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Choose Terraform action: plan, apply, destroy'
        required: true
        default: plan
      aws_region:
        description: 'AWS Region for resources'
        required: true
        default: ap-south-1
      eks_cluster_name:
        description: 'Name of your EKS cluster'
        required: true
        default: my-python-cluster
      helm_release_name:
        description: 'Helm release name'
        required: true
        default: my-python-app
      helm_chart_path:
        description: 'Path to Helm chart'
        required: true
        default: ./helm-chart

env:
  TF_WORKING_DIR: ./terraform

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask boto3 pytest flake8 awscli

      - name: Lint code
        run: flake8 main.py tests/

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} init

      - name: Terraform Validate
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} validate

      - name: Terraform Action
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} ${{ github.event.inputs.terraform_action }} -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ github.event.inputs.aws_region }}

  tests-and-deploy:
    needs: terraform
    if: ${{ github.event.inputs.terraform_action == 'apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask boto3 pytest flake8 awscli helm

      - name: Run pytest
        run: pytest -v

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ github.event.inputs.aws_region }} \
            --name ${{ github.event.inputs.eks_cluster_name }} \
            --kubeconfig ./kubeconfig
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ github.event.inputs.aws_region }}

      - name: Deploy Helm Chart
        run: |
          helm upgrade --install ${{ github.event.inputs.helm_release_name }} ${{ github.event.inputs.helm_chart_path }} \
          --kubeconfig ./kubeconfig
