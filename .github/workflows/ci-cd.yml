name: CI/CD Pipeline

on:
  push:
    branches:
      - feature/cicd
  workflow_dispatch:   # <-- Add this
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'non-prod'
        
env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: myapp-repo
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ----------------------------
  # JOB 1: Lint + Unit Tests + Terraform Validate
  # ----------------------------
  lint-test-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-dev.txt

      - name: Run flake8 linting
        run: flake8 app

      - name: Run pytest
        run: |
          export PYTHONPATH=.
          export ENV=test
          python3 -m pytest app/tests --maxfail=1 --disable-warnings -q

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '>=1.7.0, <1.8.0'

      - name: Terraform fmt & validate
        run: |
          cd terraform
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  # ----------------------------
  # JOB 2: Build Docker + Push + Deploy + Smoke Test
  # ----------------------------
  build-push-deploy:
    needs: lint-test-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/cicd'
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '>=1.7.0, <1.8.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.SECRET_KEY }}
          aws-secret-access-key: ${{ secrets.PASSWORD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker image
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG app/
          docker tag $ECR_REPOSITORY:$IMAGE_TAG ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Terraform Apply (non-prod)
        run: |
          cd terraform
          terraform init
          terraform workspace select non-prod || terraform workspace new non-prod
          terraform apply -auto-approve

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Wait for EKS nodes to be Ready
        run: |
          echo "Waiting for all EKS nodes to be Ready..."
          RETRIES=20
          COUNT=0
          until kubectl get nodes --no-headers | awk '{print $2}' | grep -vq NotReady
          do
            COUNT=$((COUNT + 1))
            if [ $COUNT -ge $RETRIES ]; then
              echo "Nodes not ready after $RETRIES attempts. Exiting."
              kubectl get nodes
              exit 1
            fi
            echo "Nodes not ready yet. Retrying in 30 seconds..."
            sleep 30
          done
          echo "All nodes are Ready:"
          kubectl get nodes

      - name: Deploy with Helm (rolling update + retries)
        run: |
          NAMESPACE="default"
          MAX_RETRIES=3
          COUNT=0
          NODE_COUNT=$(kubectl get nodes --no-headers | wc -l)
          HELM_TIMEOUT=$((NODE_COUNT * 5))m
          echo "Detected $NODE_COUNT nodes. Setting Helm timeout to $HELM_TIMEOUT."

          until helm upgrade --install myapp ./helm-chart \
            --namespace $NAMESPACE \
            --timeout $HELM_TIMEOUT \
            --wait \
            --set image.repository=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY \
            --set image.tag=$IMAGE_TAG
          do
            COUNT=$((COUNT + 1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "Helm deploy failed after $MAX_RETRIES attempts. Exiting."
              exit 1
            fi
            echo "Helm deploy failed. Retrying in 30 seconds..."
            sleep 30
          done

      - name: Smoke Test Deployment
        run: |
          echo "Running smoke test..."
          NAMESPACE="default"

          # Detect Helm service dynamically
          SERVICE_NAME=$(kubectl get svc -n $NAMESPACE -l app.kubernetes.io/instance=myapp -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$SERVICE_NAME" ]; then
            echo "Error: Helm service not found"
            exit 1
          fi
          echo "Detected service: $SERVICE_NAME"

          # Port-forward to access ClusterIP
          kubectl port-forward svc/$SERVICE_NAME 8080:80 -n $NAMESPACE &
          PF_PID=$!
          sleep 5

          RETRIES=10
          COUNT=0
          SUCCESS=false

          until [ $COUNT -ge $RETRIES ]
          do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || echo "000")
            if [ "$HTTP_CODE" == "200" ]; then
              echo "Smoke test passed! App reachable at localhost:8080"
              SUCCESS=true
              break
            else
              echo "Attempt $((COUNT+1))/$RETRIES: App not ready (HTTP $HTTP_CODE). Retrying in 15s..."
              sleep 15
              COUNT=$((COUNT+1))
            fi
          done

          # Stop port-forward
          kill $PF_PID

          if [ "$SUCCESS" != "true" ]; then
            echo "Smoke test failed. App not reachable."
            exit 1
          fi
