name: CICD Pipeline

on:
  push:
    branches:
      - cicd
  pull_request:
    branches:
      - cicd

env:
  IMAGE_NAME: my-python-app
  CLUSTER_NAME: my-python-cluster
  HELM_RELEASE: my-python-app
  HELM_CHART_PATH: ./helm-chart

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.13

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest boto3

    - name: Lint Python code
      run: flake8 main.py tests/

    - name: Run tests
      run: pytest -v

    # ---------------- Terraform ----------------
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.SECRET_KEY }}
        aws-secret-access-key: ${{ secrets.PASSWORD }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init

    - name: Terraform Validate
      working-directory: ./terraform
      run: terraform validate

    - name: Terraform Apply
      working-directory: ./terraform
      run: terraform apply -auto-approve \
        -var "region=${{ secrets.AWS_REGION }}" \
        -var "cluster_name=${{ env.CLUSTER_NAME }}" \
        -var "eks_role_arn=${{ secrets.EKS_CLUSTER_ROLE_ARN }}" \
        -var "node_role_arn=${{ secrets.EKS_NODEGROUP_ROLE_ARN }}" \
        -var "subnet_ids=[${{ secrets.SUBNET_IDS }}]"

    # ---------------- Docker + ECR ----------------
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push Docker Image
      run: |
        docker build -t $IMAGE_NAME:latest .
        docker tag $IMAGE_NAME:latest ${{ secrets.ECR_URI }}:latest
        docker push ${{ secrets.ECR_URI }}:latest

    # ---------------- Helm + EKS ----------------
    - name: Configure kubectl
      run: aws eks --region ${{ secrets.AWS_REGION }} update-kubeconfig --name $CLUSTER_NAME

    - name: Deploy Helm Chart
      run: helm upgrade --install $HELM_RELEASE $HELM_CHART_PATH

    # ---------------- CloudWatch Logging (Optional) ----------------
    - name: Verify Pods and Logs
      run: |
        kubectl get pods
        kubectl get services
