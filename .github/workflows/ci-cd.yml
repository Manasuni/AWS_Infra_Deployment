name: CI/CD Pipeline

on:
  push:
    branches:
      - feature/cicd

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: myapp-repo
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ----------------------------
  # JOB 1: Lint + Unit Tests + Terraform Validate
  # ----------------------------
  lint-test-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-dev.txt

      - name: Run flake8 linting
        run: flake8 app

      - name: Run pytest
        run: |
          export PYTHONPATH=.
          export ENV=test
          python3 -m pytest app/tests --maxfail=1 --disable-warnings -q

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '>=1.7.0, <1.8.0'

      - name: Terraform fmt & validate
        run: |
          cd terraform
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  # ----------------------------
  # JOB 2: Build Docker + Push + Deploy
  # ----------------------------
  build-push-deploy:
    needs: lint-test-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/cicd'
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '>=1.7.0, <1.8.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.SECRET_KEY }}
          aws-secret-access-key: ${{ secrets.PASSWORD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG app/
          docker tag $ECR_REPOSITORY:$IMAGE_TAG ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Push Docker image
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Terraform Apply (non-prod)
        run: |
          cd terraform
          terraform init
          terraform workspace select non-prod || terraform workspace new non-prod
          terraform apply -auto-approve

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Deploy with Helm (rolling update)
        run: |
          helm upgrade --install myapp ./helm-chart \
            --timeout 10m \
            --wait \
            --set image.repository=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY \
            --set image.tag=$IMAGE_TAG
