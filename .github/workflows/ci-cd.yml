name: CI/CD Pipeline with Terraform

on:
  push:
    branches:
      - cicd
  pull_request:

env:
  IMAGE_NAME: my-python-app
  CLUSTER_NAME: my-python-cluster
  HELM_RELEASE: my-python-app
  HELM_CHART_PATH: ./helm-chart
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: ./terraform   # path to your terraform folder

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    # 1️⃣ Set up Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.13

    # 2️⃣ Install Python dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 3️⃣ Run pytest
    - name: Run pytest
      run: pytest -v

    # 4️⃣ Configure AWS
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.SECRET_KEY }}
        aws-secret-access-key: ${{ secrets.PASSWORD }}
        aws-region: ${{ env.AWS_REGION }}

    # 5️⃣ Set up Terraform
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.7.6

    # 6️⃣ Terraform init
    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform init

    # 7️⃣ Terraform validate
    - name: Terraform Validate
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform validate

    # 8️⃣ Terraform apply
    - name: Terraform Apply
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform apply -auto-approve
      env:
        TF_VAR_aws_region: ${{ env.AWS_REGION }}
        TF_VAR_cluster_name: ${{ env.CLUSTER_NAME }}
        # Add other TF_VARs if you have (like nodegroup role ARN, subnet IDs, etc.)

    # 9️⃣ Log in to ECR
    - name: Login to Amazon ECR
      run: |
        aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
        docker login --username AWS --password-stdin 533267338763.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

    # 🔟 Build Docker image
    - name: Build Docker image
      run: |
        docker build -t ${{ env.IMAGE_NAME }} .
        docker tag ${{ env.IMAGE_NAME }} 533267338763.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.IMAGE_NAME }}

    # 1️⃣1️⃣ Push Docker image to ECR
    - name: Push Docker image
      run: docker push 533267338763.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.IMAGE_NAME }}

    # 1️⃣2️⃣ Install Helm
    - name: Install Helm
      uses: azure/setup-helm@v3

    # 1️⃣3️⃣ Update kubeconfig
    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

    # 1️⃣4️⃣ Deploy Helm chart
    - name: Deploy Helm chart
      run: |
        helm upgrade --install ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART_PATH }} \
          --set image.repository=533267338763.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.IMAGE_NAME }} \
          --set image.tag=latest
