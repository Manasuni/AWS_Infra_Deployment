name: Test Manual Trigger

on:
  workflow_dispatch:  # Enables the "Run workflow" button

jobs:
  manual-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Print Branch and Commit
        run: |
          echo "Running workflow on branch: $GITHUB_REF"
          echo "Last commit: $GITHUB_SHA"
