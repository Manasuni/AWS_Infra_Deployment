name: Security & Compliance Terraform CI/CD

on:
  push:
    branches:
      - feature/security-iac
  workflow_dispatch:

jobs:
  terraform-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.OIDC_ROLE_NAME }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/feature/security-iac'
        run: terraform apply -auto-approve tfplan

      - name: Run Security Scan (Gemini mock)
        run: |
          echo "## Security Report" > security_report.md
          echo "- Terraform code scanned: ✅" >> security_report.md
          echo "- SSM Parameters: ✅" >> security_report.md
          echo "- GuardDuty enabled: ✅" >> security_report.md
          cat security_report.md
