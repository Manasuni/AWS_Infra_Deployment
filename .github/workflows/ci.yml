name: Security & Compliance Terraform CI/CD

on:
  push:
    branches:
      - feature/security-iac
  workflow_dispatch:

jobs:
  terraform-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.SECRET_KEY }}
          aws-secret-access-key: ${{ secrets.PASSWORD }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/feature/security-iac'
        run: terraform apply -auto-approve tfplan

      - name: Create Example SSM Parameters
        run: |
          aws ssm put-parameter --name "/my-app/dev/db_password" --value "example-db-pass-123" --type SecureString --overwrite
          aws ssm put-parameter --name "/my-app/dev/api_key" --value "example-api-key-abc" --type SecureString --overwrite

      - name: Run Security Scan (Gemini mock)
        run: |
          echo "## Security Report" > security_report.md
          echo "- Terraform code scanned: ✅" >> security_report.md
          echo "- SSM Parameters: ✅" >> security_report.md
          echo "- GuardDuty enabled: ✅" >> security_report.md
          echo "- AWS Config rules applied: ✅" >> security_report.md
          cat security_report.md
